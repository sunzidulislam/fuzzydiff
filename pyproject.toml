[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzydiff"
version = "0.1.0"
description = "Hedged fuzzy-attribute guidance for text-to-image diffusion (SD3-Medium)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "diffusers==0.31.0",
    "transformers==4.56.2",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
eval = ["piq", "open_clip_torch"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["fuzzydiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# these set USE_TF/USE_JAX before torch is imported (Kaggle images ship TensorFlow and JAX)
"baselines/*" = ["E402"]
"baselines/*/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fuzzydiff"]
